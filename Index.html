<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naimat AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #222;
      font-size: 24px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 30%;
      color: #aaa;
    }

    .input-area {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #222;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #151a21;
      color: white;
      outline: none;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #000;
      font-weight: bold;
    }

    .message {
      background: #151a21;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <header>🤖 Naimat AI</header>

  <div class="chat" id="chat">
    <div class="welcome">
      <h2>Hello! 👋</h2>
      <p>I'm Naimat AI.</p>
      <p>Ask me anything.</p>
    </div>
  </div>

  <div class="input-area">
    <input id="message" type="text" placeholder="Ask Naimat AI..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");

      if (input.value.trim() === "") return;

      const message = document.createElement("div");
      message.className = "message";
      message.textContent = "You: " + input.value;

      chat.appendChild(message);

      input.value = "";
    }
  </script>

</body>
</html>
